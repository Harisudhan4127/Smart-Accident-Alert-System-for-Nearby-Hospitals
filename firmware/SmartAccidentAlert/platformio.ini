; platformio.ini — CI-friendly build definition.
;
; The verified build path is Arduino CLI (see firmware/README.md). PlatformIO was
; not available in the development environment, so this file is provided for CI
; and for developers who prefer PlatformIO, and has not been run end to end.
;
; The library dependencies pin the same versions the Arduino CLI build resolved,
; so both paths compile the same sources against the same headers.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -DCORE_DEBUG_LEVEL=0

; Pinned to the versions the Arduino CLI build used. NimBLE-Arduino 2.x changed
; the callback signatures and the property flags, so the version is not
; incidental -- comm.cpp adapts both APIs, but only 2.5.1 has been compiled.
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17

; comm.cpp is a transport shim and the sensor code is timing-sensitive, so both
; are compiled in release mode with debug asserts off.
build_unflags = -Os
build_type = release
