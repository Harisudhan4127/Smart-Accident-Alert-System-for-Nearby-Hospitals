distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Gradle 8.14 — the version `flutter create` generates for Flutter 3.35.x.
#
# Do NOT jump to Gradle 9 for the "support will soon be dropped" warning.
# That warning is about a future Flutter release, and Gradle 9 requires AGP 9,
# whose new DSL this Flutter version cannot compile:
#   "Project.android(...) is deprecated ... will be removed in AGP 10.0"
# plus `kotlinOptions` is gone in favour of `compilerOptions`. Verified by
# attempting it — the release build fails at script compilation.
# Revisit when the Flutter SDK templates AGP 9 itself.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
